<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ECG Animation for Kids</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
      text-align: center;
      overflow-x: hidden;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .pulse {
      position: fixed;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(0,229,255,0.08), transparent 60%);
      animation: pulse 4s infinite;
      z-index: -1;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.2); opacity: 0.6; }
      100% { transform: scale(1); opacity: 0.3; }
    }

    .title {
      position: absolute;
      top: 18px;
      right: 20px;
      font-size: 18px;
      font-weight: 600;
      color: #00e5ff;
      text-shadow: 0 0 10px rgba(0,229,255,0.5);
    }

    .lang-btn {
      position: absolute;
      top: 18px;
      left: 20px;
      padding: 6px 12px;
      font-size: 12px;
      border: 1px solid #00e5ff;
      background: transparent;
      color: #00e5ff;
      border-radius: 8px;
      cursor: pointer;
    }

    .container {
      padding: 80px 15px 30px;
    }

    h2 {
      font-size: 26px;
      margin-bottom: 20px;
    }

    .video-box {
      position: relative;
      display: inline-block;
      max-width: 900px;
      width: 100%;
    }

    video {
      width: 100%;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(0,229,255,0.2);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%,-50%);
      font-size: 45px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid #00e5ff;
      background: rgba(0,229,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .footer {
      margin-top: 15px;
      font-size: 13px;
      opacity: 0.6;
    }

    @media (max-width: 600px) {
      .title { font-size: 14px; }
      h2 { font-size: 20px; }
      .play-btn { width: 60px; height: 60px; font-size: 32px; }
    }
  </style>
</head>

<body>

  <div class="pulse"></div>

  <div class="title" id="titleText">ECG Animation for Kids</div>

  <button class="lang-btn" onclick="toggleLang()">FA / EN</button>

  <div class="container">

    <h2 id="subtitle">🫀 ECG & Heart</h2>

    <div class="video-box">

      <!-- 🎬 Video -->
      <video id="video" controls playsinline>
        
        <source src="https://pixeldrain.com/api/file/AzJ84FU4" type="video/mp4">

        <!-- Subtitles -->
        <track kind="subtitles" src="fa.vtt" srclang="fa" label="فارسی" default>
        <track kind="subtitles" src="en.vtt" srclang="en" label="English">

      </video>

      <div class="play-btn" id="playBtn" onclick="playVideo()">▶</div>

    </div>

    <div class="footer">
      Learn how ECG works in a simple way ❤️
    </div>

  </div>

  <script>
    const video = document.getElementById("video");
    const btn = document.getElementById("playBtn");

    function playVideo() {
      video.play();
      btn.style.display = "none";
    }

    video.addEventListener("pause", () => btn.style.display = "flex");
    video.addEventListener("play", () => btn.style.display = "none");

    let isEN = true;

    function toggleLang() {
      const title = document.getElementById("titleText");
      const subtitle = document.getElementById("subtitle");

      if (isEN) {
        title.innerText = "ECG انیمیشن برای کودکان";
        subtitle.innerText = "🫀 ای‌کی‌جی و قلب";
      } else {
        title.innerText = "ECG Animation for Kids";
        subtitle.innerText = "🫀 ECG & Heart";
      }

      isEN = !isEN;
    }
  </script>

</body>
</html>
